[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atg_engine"
version = "0.1.0"
description = "Autonomous Twitter Growth Engine - CrewAI-based system for growing Twitter accounts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "tweepy>=4.14.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "psycopg2-binary>=2.9.0",
    "litellm>=1.0.0",
    "fastapi>=0.100.0",
    "fastapi-sso>=0.16.0",
    "mcp>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
atge = "atg_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atg_engine*"]
